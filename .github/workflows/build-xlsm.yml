name: Build PCD Excel XLSM
# DEV build trigger

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force DEV build'
        required: false
        default: 'true'
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
      - 'VERSION.json'

concurrency:
  group: pcd-excel-build-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install xlsxwriter
          python -m pip install git+https://github.com/Beakerboy/MS-OVBA.git

      - name: Compile real VBA project
        run: python build/compile_vba_project.py

      - name: Download known-good VBA base
        run: |
          curl -L --fail -o build/vbaProject.bin https://raw.githubusercontent.com/jmcnamara/XlsxWriter/main/examples/vbaProject.bin

      - name: Inject PCD VBA into known-good base
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'

      - name: Run VBA injector
        run: |
          cd build/vba_inject
          go get github.com/kay-ws/ovba-writer/vbaproject@c2e085be54cd92f75efd52291d6f6b2ceea34c81
          go mod tidy
          go run . ../../build/vbaProject.bin ../../vba/PCD_MagicImport.bas ../../vba/PCD_Updater.bas ../../build/vbaProject.bin

      - name: VBA pre-flight syntax check
        run: |
          cd build/vba_inject
          go run ./validatecmd ../../build/vbaProject.bin "Private Sub ScheduleReplacement(ByVal newFile As String, ByVal oldFile As String, ByVal processId As Long)"

      - name: Build XLSM
        run: python build/build_xlsm.py

      - name: Validate final XLSM VBA
        run: |
          VERSION=$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("build/build_xlsm.py").read_text(encoding="utf-8")
          print(re.search(r'VERSION\s*=\s*"([^"]+)"', text).group(1))
          PY
          )
          FILE="dist/PCD-Excel-Version-$VERSION.xlsm"
          test -f "$FILE"
          unzip -p "$FILE" xl/vbaProject.bin > build/final-vbaProject.bin
          test -s build/final-vbaProject.bin
          cd build/vba_inject
          go run ./validatecmd ../../build/final-vbaProject.bin "Private Sub ScheduleReplacement(ByVal newFile As String, ByVal oldFile As String, ByVal processId As Long)"

      - name: Publish artifact and checksum
        run: |
          VERSION=$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("build/build_xlsm.py").read_text(encoding="utf-8")
          print(re.search(r'VERSION\s*=\s*"([^"]+)"', text).group(1))
          PY
          )
          FILE="dist/PCD-Excel-Version-$VERSION.xlsm"
          test -f "$FILE"
          cp "$FILE" dist/PCD-Excel-Version-latest.xlsm
          cp "$FILE" dist/PCD-Excel-Version-dev.xlsm
          SHA256=$(sha256sum dist/PCD-Excel-Version-dev.xlsm | cut -d ' ' -f1)

          python - <<PY
          import json
          p="VERSION.json"
          with open(p, encoding="utf-8") as f:
              d=json.load(f)
          d["version"] = "$VERSION"
          d["artifact"] = "dist/PCD-Excel-Version-dev.xlsm"
          d["latest"] = "dist/PCD-Excel-Version-latest.xlsm"
          d["sha256"] = "$SHA256"
          with open(p, "w", encoding="utf-8") as f:
              json.dump(d, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY

          LATEST_SHA256=$(sha256sum dist/PCD-Excel-Version-latest.xlsm | cut -d ' ' -f1)
          DEV_SHA256=$(sha256sum dist/PCD-Excel-Version-dev.xlsm | cut -d ' ' -f1)
          test "$LATEST_SHA256" = "$DEV_SHA256"
          test "$LATEST_SHA256" = "$SHA256"

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCD-Excel-Version-build
          path: |
            dist/PCD-Excel-Version-*.xlsm
            !dist/PCD-Excel-Version-latest.xlsm
            !dist/PCD-Excel-Version-dev.xlsm

      - name: Publish DEV XLSM to SharePoint
        if: ${{ secrets.MS_GRAPH_TENANT_ID != '' && secrets.MS_GRAPH_CLIENT_ID != '' && secrets.MS_GRAPH_CLIENT_SECRET != '' && secrets.SHAREPOINT_USER_UPN != '' }}
        env:
          TENANT_ID: ${{ secrets.MS_GRAPH_TENANT_ID }}
          CLIENT_ID: ${{ secrets.MS_GRAPH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.MS_GRAPH_CLIENT_SECRET }}
          USER_UPN: ${{ secrets.SHAREPOINT_USER_UPN }}
        run: |
          set -euo pipefail
          FILE="dist/PCD-Excel-Version-dev.xlsm"
          TOKEN_RESPONSE=$(curl -sS --fail \\
            -X POST "https://login.microsoftonline.com/$TENANT_ID/oauth2/v2.0/token" \\
            -H "Content-Type: application/x-www-form-urlencoded" \\
            --data-urlencode "client_id=$CLIENT_ID" \\
            --data-urlencode "client_secret=$CLIENT_SECRET" \\
            --data-urlencode "scope=https://graph.microsoft.com/.default" \\
            --data-urlencode "grant_type=client_credentials")
          ACCESS_TOKEN=$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$TOKEN_RESPONSE")

          curl -sS --fail \\
            -X PUT \\
            -H "Authorization: Bearer $ACCESS_TOKEN" \\
            -H "Content-Type: application/vnd.ms-excel.sheet.macroEnabled.12" \\
            --data-binary "@$FILE" \\
            "https://graph.microsoft.com/v1.0/users/$USER_UPN/drive/root:/Documents/Desktop/PCD-Excel-Version-dev.xlsm:/content"

          echo "SharePoint publication succeeded: $FILE"

      - name: Publish latest XLSM to repository
        run: |
          # Keep the freshly built files outside the working tree while we
          # synchronize with the current remote main. This avoids rebase
          # conflicts on generated XLSM binaries and VERSION.json.
          mkdir -p /tmp/pcd-publish
          cp dist/*.xlsm /tmp/pcd-publish/
          cp VERSION.json /tmp/pcd-publish/VERSION.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Publish attempt $attempt/3"

            git fetch origin main
            git reset --hard origin/main

            # Restore only the freshly generated publication files.
            cp /tmp/pcd-publish/*.xlsm dist/
            cp /tmp/pcd-publish/VERSION.json VERSION.json

            git add dist/*.xlsm VERSION.json

            if git diff --cached --quiet; then
              echo "Nothing to publish."
              exit 0
            fi

            git commit -m "build: publish real VBA XLSM [skip ci]"

            if git push origin HEAD:main; then
              echo "Publication succeeded."
              exit 0
            fi

            echo "Push raced with another main update; retrying..."
            sleep 2
          done

          echo "Publication failed after 3 attempts."
          exit 1
