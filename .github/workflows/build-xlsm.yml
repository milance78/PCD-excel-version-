name: Build PCD Excel XLSM

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: python -m pip install xlsxwriter olefile
      - name: Build XLSM
        run: python build/build_xlsm.py
      - name: Inspect VBA container
        run: python build/inspect_vba.py
      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCD-Excel-Version
          path: dist/PCD-Excel-Version-*.xlsm
      - name: Publish latest XLSM to repository
        run: |
          cp dist/PCD-Excel-Version-*.xlsm dist/PCD-Excel-Version-latest.xlsm
          SHA256=$(sha256sum dist/PCD-Excel-Version-latest.xlsm | cut -d ' ' -f1)
          python - <<PY
          import json
          p="VERSION.json"
          with open(p, encoding="utf-8") as f: d=json.load(f)
          d.update({
              "version": "0.1.0-corp-test-2",
              "channel": "development",
              "status": "corporate-test-artifact",
              "artifact": "dist/PCD-Excel-Version-latest.xlsm",
              "sha256": "$SHA256",
              "updateSource": "github-raw",
              "updateEnabled": True,
              "offlineRuntime": True
          })
          with open(p,"w",encoding="utf-8") as f:
              json.dump(d,f,indent=2,ensure_ascii=False)
              f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/PCD-Excel-Version-latest.xlsm VERSION.json
          git diff --cached --quiet || git commit -m "build: publish latest XLSM [skip ci]"
          git push
