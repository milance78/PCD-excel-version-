name: Build PCD Excel XLSM

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install xlsxwriter
          python -m pip install git+https://github.com/Beakerboy/MS-OVBA.git
      - name: Compile real VBA project
        run: python build/compile_vba_project.py
      - name: Build XLSM
        run: python build/build_xlsm.py
      - name: Publish artifact and checksum
        run: |
          cp dist/PCD-Excel-Version-0.1.0-corp-test-2.xlsm dist/PCD-Excel-Version-latest.xlsm
          SHA256=$(sha256sum dist/PCD-Excel-Version-latest.xlsm | cut -d ' ' -f1)
          python - <<PY
          import json
          p="VERSION.json"
          with open(p, encoding="utf-8") as f: d=json.load(f)
          d["sha256"] = "$SHA256"
          with open(p,"w",encoding="utf-8") as f:
              json.dump(d,f,indent=2,ensure_ascii=False)
              f.write("\n")
          PY
      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCD-Excel-Version-corp-test-2
          path: |
            dist/PCD-Excel-Version-0.1.0-corp-test-2.xlsm
            dist/PCD-Excel-Version-latest.xlsm
      - name: Publish latest XLSM to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/PCD-Excel-Version-0.1.0-corp-test-2.xlsm dist/PCD-Excel-Version-latest.xlsm VERSION.json
          git diff --cached --quiet || git commit -m "build: publish real VBA XLSM [skip ci]"
          git pull --rebase origin main
          git push
